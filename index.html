<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RhB Fahrdienst-Locator Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e3000f">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f4f9; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        /* Karte oben - nimmt 50% des Bildschirms ein */
        #map { 
            width: 100%; 
            height: 45vh; 
            border-bottom: 3px solid #e3000f;
            z-index: 1;
        }

        /* Panel unten - nimmt den Rest ein und ist IMMER SICHTBAR */
        .controls { 
            width: 100%; 
            height: 55vh; 
            background: white; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { color: #e3000f; margin: 0; font-size: 1.3em; }

        .scroll-area {
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 10px;
        }

        .data-box { 
            background: #f0f0f0; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-left: 5px solid #e3000f;
            font-family: monospace; 
            font-size: 13px;
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #e3000f; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-bottom: 10px; 
            font-weight: bold;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active { background-color: #a3000b; transform: scale(0.98); }

        .btn-test { background-color: #444; }
        .btn-test:active { background-color: #222; }

        .call-btn { 
            background-color: #28a745; 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            width: 100%; 
            padding: 16px; 
            color: white; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Verzeichnis Styles */
        .dir-container { border: 1px solid #ccc; border-radius: 6px; margin-top: 10px; }
        .dir-head { background: #eee; padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 6px; }
        .dir-list { display: none; background: white; }
        .dir-list.open { display: block; }
        .dir-item { 
            padding: 12px; 
            border-top: 1px solid #eee; 
            display: flex; 
            flex-direction: column; 
        }
        .dir-title { font-weight: bold; font-size: 14px; color: #333; }
        .dir-link { 
            color: #28a745; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 5px; 
            padding: 8px; 
            background: #f0fff0; 
            border-radius: 4px; 
            text-align: center; 
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <div class="header">
        <h2>RhB Fahrdienst Locator</h2>
    </div>

    <div class="scroll-area">
        <button onclick="startTracking()">📍 Position verfolgen</button>
        <button class="btn-test" onclick="simulatePosition()">🧪 Test: Poschiavo (Simulation)</button>
        
        <div class="data-box" id="info">GPS Status: Inaktiv</div>
        
        <a id="autoCallBtn" href="#" class="call-btn" style="display: none;">📞 Automatische Nummer</a>

        <div class="dir-container">
            <div class="dir-head" onclick="toggleDirectory()">📞 Manuelles Telefonbuch (Anzeigen)</div>
            <div class="dir-list" id="dirList"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const bzTelefonbuch = [
        { route: "(Chur) - Untervaz", phone: "0812882682" },
        { route: "Landquart - (Untervaz)", phone: "0812882681" },
        { route: "(Landquart) - Schiers", phone: "0812882660" },
        { route: "(Chur) - Arosa", phone: "0812882696" },
        { route: "Chur - (Felsberg)", phone: "0812882617" },
        { route: "Felsberg - Reichenau", phone: "0812882685" },
        { route: "(Reichenau) - (Rueun)", phone: "0812882686" },
        { route: "Rueun - Disentis", phone: "0812882621" },
        { route: "(Reichenau) - Thusis", phone: "0812882683" },
        { route: "(Thusis) - Filisur", phone: "0812882684" },
        { route: "(Filisur) - (Bever)", phone: "0812882605" },
        { route: "S-chanf - (St.Moritz)", phone: "0812882667" },
        { route: "St.Moritz - Pontresina", phone: "0812882641" },
        { route: "(St.Moritz) - (Pontresina) - Bever", phone: "0812882667" },
        { route: "(Pontresina) - (Poschiavo)", phone: "0812882664" },
        { route: "Poschiavo - (Tirano)", phone: "0812882665" },
        { route: "(Schiers) - Klosters", phone: "0812883711" },
        { route: "(Klosters) - Davos", phone: "0812883602" },
        { route: "(Davos) - (Filisur)", phone: "0812883631" },
        { route: "(Klosters) - Sagliains", phone: "0812883601" },
        { route: "Scuol - Susch", phone: "0812883603" },
        { route: "(Susch) - (Bever)", phone: "0812883635" },
        { route: "Tirano (Nicht Fernst.)", phone: "0812885440" }
    ];

    let map, userMarker, watchId;
    const info = document.getElementById('info');
    const autoCall = document.getElementById('autoCallBtn');

    // Init Karte
    map = L.map('map', { crs: L.CRS.EPSG2056, zoomControl: false }).setView([46.65, 9.75], 9);
    L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/2056/{z}/{x}/{y}.jpeg').addTo(map);
    L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.bav.schienennetz/default/current/2056/{z}/{x}/{y}.png', { opacity: 0.8 }).addTo(map);
    userMarker = L.marker([46.65, 9.75]).addTo(map);
    userMarker.setOpacity(0);

    function startTracking() {
        console.log("Tracking gestartet");
        info.innerHTML = "GPS Status: Suche Signal...";
        userMarker.setOpacity(1);
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
            (pos) => updatePos(pos.coords.latitude, pos.coords.longitude),
            (err) => { info.innerHTML = "Fehler: " + err.message; },
            { enableHighAccuracy: true }
        );
    }

    function simulatePosition() {
        console.log("Simulation gestartet");
        userMarker.setOpacity(1);
        updatePos(46.3265, 10.0575);
    }

    function updatePos(lat, lng) {
        userMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], 14);
        info.innerHTML = `Position: ${lat.toFixed(4)}, ${lng.toFixed(4)}<br>Suche Gleisabschnitt...`;
        
        // LV95 Umrechnung (Näherung für API)
        let e = 2600000 + (lng - 7.4) * 75000;
        let n = 1200000 + (lat - 46.9) * 111000;
        
        fetch(`https://api3.geo.admin.ch/rest/services/api/MapServer/identify?geometryType=esriGeometryPoint&geometry=${e},${n}&imageDisplay=800,600,96&mapExtent=${e-200},${n-200},${e+200},${n+200}&tolerance=70&layers=all:ch.bav.schienennetz&sr=2056&returnGeometry=false`)
        .then(res => res.json())
        .then(data => {
            autoCall.style.display = "none";
            if (data.results && data.results.length > 0) {
                let attr = data.results[0].attributes;
                let bName = attr.betreiber || "";
                let sName = attr.streckenbezeichnung || "";
                info.innerHTML += `<br>Gleis: ${sName}`;
                
                if (bName.includes("RhB")) {
                    matchCall(sName);
                }
            } else {
                info.innerHTML += "<br>Kein Gleis gefunden.";
            }
        });
    }

    function matchCall(sName) {
        let best = null;
        let max = 0;
        bzTelefonbuch.forEach(e => {
            let score = 0;
            let keys = e.route.toLowerCase().replace(/[()]/g, "").split(/[\s-]+/);
            keys.forEach(k => { if (sName.toLowerCase().includes(k)) score++; });
            if (score > max) { max = score; best = e; }
        });

        if (best && max > 0) {
            let num = "+41" + best.phone.substring(1);
            autoCall.href = "tel:" + num;
            autoCall.innerHTML = "📞 " + best.route + " anrufen";
            autoCall.style.display = "block";
        }
    }

    // Telefonbuch füllen
    const dList = document.getElementById('dirList');
    bzTelefonbuch.forEach(e => {
        let item = document.createElement('div');
        item.className = 'dir-item';
        item.innerHTML = `<span class="dir-title">${e.route}</span><a href="tel:+41${e.phone.substring(1)}" class="dir-link">Anrufen: ${e.phone}</a>`;
        dList.appendChild(item);
    });

    function toggleDirectory() { dList.classList.toggle('open'); }
</script>

</body>
</html>
