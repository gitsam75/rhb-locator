<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RhB Fahrdienst-Locator Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e3000f">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #map { width: 100%; height: 40vh; border-bottom: 3px solid #e3000f; z-index: 1; background-color: #e5e3df; }

        .controls { width: 100%; height: 60vh; background: white; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 10; }

        .header { display: flex; align-items: center; margin-bottom: 10px; }
        h2 { color: #e3000f; margin: 0; font-size: 1.3em; }

        .scroll-area { overflow-y: auto; flex-grow: 1; padding-bottom: 10px; }

        .data-box { background: #f0f0f0; padding: 12px; margin-bottom: 10px; border-left: 5px solid #e3000f; font-family: monospace; font-size: 13px; line-height: 1.5; }
        
        .highlight-km { color: #e3000f; font-weight: bold; font-size: 15px; display: block; margin-top: 5px; background: #ffe6e6; padding: 8px; border-radius: 4px;}

        .call-btn { background-color: #28a745; text-decoration: none; display: block; text-align: center; width: 100%; padding: 16px; color: white; border-radius: 6px; font-size: 16px; font-weight: bold; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .call-btn:active { background-color: #218838; transform: scale(0.98); }

        .btn-test { width: 100%; padding: 10px; background-color: #666; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 10px; }

        .dir-container { border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; }
        .dir-head { background: #eee; padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 6px; text-align: center;}
        .dir-list { display: none; background: white; }
        .dir-list.open { display: block; }
        .dir-item { padding: 12px; border-top: 1px solid #eee; display: flex; flex-direction: column; }
        .dir-title { font-weight: bold; font-size: 14px; color: #333; }
        .dir-link { color: #28a745; text-decoration: none; font-weight: bold; margin-top: 5px; padding: 8px; background: #f0fff0; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
    <div class="header">
        <h2>RhB Fahrdienst Locator</h2>
    </div>

    <div class="scroll-area">
        <a id="autoCallBtn" href="#" class="call-btn" style="display: none;">📞 Fahrdienst anrufen</a>
        
        <div class="data-box" id="info">
            Warte auf GPS-Signal...<br>
            <small>(Automatische Ortung aktiv)</small>
        </div>
        
        <button class="btn-test" onclick="simulatePosition()">🧪 Test: Standort simulieren (Nähe S-chanf)</button>

        <div class="dir-container">
            <div class="dir-head" onclick="toggleDirectory()">⬇️ Manuelles Telefonbuch öffnen ⬇️</div>
            <div class="dir-list" id="dirList"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- DATENBANK TELEFONBUCH ---
    const bzTelefonbuch = [
        { route: "(Chur) - Untervaz", phone: "0812882682" },
        { route: "Landquart - (Untervaz)", phone: "0812882681" },
        { route: "(Landquart) - Schiers", phone: "0812882660" },
        { route: "(Chur) - Arosa", phone: "0812882696" },
        { route: "Chur - (Felsberg)", phone: "0812882617" },
        { route: "Felsberg - Reichenau", phone: "0812882685" },
        { route: "(Reichenau) - (Rueun)", phone: "0812882686" },
        { route: "Rueun - Disentis", phone: "0812882621" },
        { route: "(Reichenau) - Thusis", phone: "0812882683" },
        { route: "(Thusis) - Filisur", phone: "0812882684" },
        { route: "(Filisur) - (Bever)", phone: "0812882605" },
        { route: "S-chanf - (St.Moritz)", phone: "0812882667" },
        { route: "St.Moritz - Pontresina", phone: "0812882641" },
        { route: "(St.Moritz) - (Pontresina) - Bever", phone: "0812882667" },
        { route: "(Pontresina) - (Poschiavo)", phone: "0812882664" },
        { route: "Poschiavo - (Tirano)", phone: "0812882665" },
        { route: "(Schiers) - Klosters", phone: "0812883711" },
        { route: "(Klosters) - Davos", phone: "0812883602" },
        { route: "(Davos) - (Filisur)", phone: "0812883631" },
        { route: "(Klosters) - Sagliains", phone: "0812883601" },
        { route: "Scuol - Susch", phone: "0812883603" },
        { route: "(Susch) - (Bever)", phone: "0812883635" },
        { route: "Tirano (Nicht Fernst.)", phone: "0812885440" }
    ];

    // --- DATENBANK KILOMETER (Aus PDF) ---
    const kmDaten = {
        "Landquart": "0.0", "Landquart Ried": "1.3", "Igis": "2.2", "Zizers Altlöser": "3.6", "Zizers": "4.0", "Untervaz-Trimmis": "5.8", "Haldenstein": "11.0", "Chur Wiesental": "12.6", 
        "Chur": "13.7 (Stamm) / 0.0 (Arosa)", "Chur West": "15.2", "Felsberg": "17.7", "Domat/Ems": "20.2", "Reichenau-Tamins": "23.6", "Bonaduz": "27.4", "Rhäzüns": "28.7", "Rothenbrunnen": "32.8", "Rodels-Realta": "36.6", "Cazis": "38.5", "Thusis": "41.3",
        "Solis": "49.3", "Tiefencastel": "53.9", "Surava": "58.1", "Alvaneu": "60.8", "Filisur": "64.4 (Albula) / 69.3 (Davos)", "Bergün/Bravuogn": "73.1", "Preda": "85.7", "Spinas": "91.8", "Bever": "95.6", "Samedan": "97.7", "Celerina": "100.3", "St. Moritz": "102.9 (Albula) / 0.0 (Bernina)", "Pontresina": "103.0 (Samedan) / 5.8 (Bernina)",
        "Malans": "2.1", "Grüsch": "7.9", "Schiers": "11.4", "Fideris": "18.2", "Küblis": "21.4", "Saas": "24.6", "Serneus": "27.7", "Klosters Dorf": "30.7", "Klosters Platz": "32.4", "Davos Dorf": "47.3", "Davos Platz": "50.0", "Davos Glaris": "56.3", "Davos Wiesen": "64.6",
        "Sagliains": "54.5", "Lavin": "130.1", "Guarda": "133.3", "Ardez": "137.4", "Scuol-Tarasp": "145.0", "Susch": "126.8", "Zernez": "120.4", "S-chanf": "106.0", "Zuoz": "103.8", 
        "Trin": "28.3", "Versam-Safien": "32.7", "Valendas-Sagogn": "36.9", "Castrisch": "40.7", "Ilanz": "42.9", "Rueun": "48.0", "Trun": "60.8", "Rabius-Surrein": "64.0", "Disentis/Mustér": "72.9",
        "Lüen-Castiel": "8.7", "St. Peter-Molinis": "12.7", "Peist": "14.4", "Langwies": "17.9", "Litzirüti": "20.7", "Arosa": "25.7",
        "Morteratsch": "12.2", "Bernina Diavolezza": "16.8", "Ospizio Bernina": "22.3", "Alp Grüm": "27.1", "Cavaglia": "33.1", "Poschiavo": "43.6", "Le Prese": "48.0", "Miralago": "50.8", "Brusio": "53.9", "Campocologno": "57.6", "Tirano": "60.7"
    };

    let map, userMarker, watchId;
    const info = document.getElementById('info');
    const autoCall = document.getElementById('autoCallBtn');

    function convertWGSToLV95(lat, lng) {
        const phi = (lat * 3600 - 169028.66) / 10000;
        const lambda = (lng * 3600 - 26782.5) / 10000;
        const E = 2600072.37 + 211455.93 * lambda - 10938.51 * lambda * phi - 0.36 * lambda * Math.pow(phi, 2) - 44.54 * Math.pow(lambda, 3);
        const N = 1200147.07 + 308807.95 * phi + 3745.25 * Math.pow(lambda, 2) + 76.63 * Math.pow(phi, 2) - 194.56 * Math.pow(lambda, 2) * phi + 119.79 * Math.pow(phi, 3);
        return { E: Math.round(E), N: Math.round(N) };
    }

    map = L.map('map', { zoomControl: false }).setView([46.65, 9.75], 9);
    L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', { attribution: '&copy; swisstopo' }).addTo(map);
    L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.bav.schienennetz/default/current/3857/{z}/{x}/{y}.png', { opacity: 0.8 }).addTo(map);

    userMarker = L.marker([46.65, 9.75], {
        icon: L.divIcon({className: 'user-icon', html: '<div style="background-color: #007bff; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>'})
    }).addTo(map);
    userMarker.setOpacity(0);

    // AUTOSTART
    window.onload = function() { startTracking(); };

    function startTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
            (pos) => updatePos(pos.coords.latitude, pos.coords.longitude),
            (err) => { info.innerHTML = "GPS-Fehler: Bitte erlaube der Seite den Standortzugriff."; },
            { enableHighAccuracy: true }
        );
    }

    function simulatePosition() {
        // Simulation: Zwischen S-chanf und Cinuos-chel-Brail
        updatePos(46.6235, 9.9950); 
    }

    function updatePos(lat, lng) {
        userMarker.setOpacity(1);
        userMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], 15);
        
        let lv95 = convertWGSToLV95(lat, lng);
        
        // Wir suchen im Radius von ca. 2km (tolerance=400) nach Schienen UND Haltestellen
        let url = `https://api3.geo.admin.ch/rest/services/api/MapServer/identify?geometryType=esriGeometryPoint&geometry=${lv95.E},${lv95.N}&imageDisplay=800,600,96&mapExtent=${lv95.E-2000},${lv95.N-2000},${lv95.E+2000},${lv95.N+2000}&tolerance=400&layers=all:ch.bav.schienennetz,ch.bav.haltestellen-oev&sr=2056&returnGeometry=true`;

        fetch(url).then(res => res.json()).then(data => {
            let trackName = "Unbekannt";
            let closestStation = null;
            let minDistance = 999999;

            if (data.results) {
                // Daten filtern
                data.results.forEach(res => {
                    if (res.layerBodId === 'ch.bav.schienennetz' && res.attributes.betreiber.includes("RhB")) {
                        trackName = res.attributes.streckenbezeichnung;
                    }
                    if (res.layerBodId === 'ch.bav.haltestellen-oev') {
                        // Distanz berechnen (Satz des Pythagoras in Schweizer Metern)
                        let statE = res.geometry.x;
                        let statN = res.geometry.y;
                        let dist = Math.sqrt(Math.pow(lv95.E - statE, 2) + Math.pow(lv95.N - statN, 2));
                        
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestStation = res.attributes.name;
                        }
                    }
                });
            }

            // Kilometer-Interpolation aus der PDF-Datenbank
            let kmText = "Kein Referenzpunkt in 2km Nähe.";
            let distText = "";
            if (closestStation) {
                // Bereinige Stationsnamen für besseres Matching (z.B. "S-chanf" statt "S-chanf, Bahnhof")
                let cleanName = closestStation.split(",")[0]; 
                let exactKm = kmDaten[cleanName] || "Unbekannt";
                
                if(exactKm !== "Unbekannt") {
                    kmText = `Basis: ${cleanName} (km ${exactKm})`;
                    distText = `Du bist ca. ${Math.round(minDistance)} Meter von diesem Punkt entfernt.`;
                }
            }

            info.innerHTML = `
                Gleis: <strong>${trackName}</strong><br>
                <div class="highlight-km">
                    📍 ${kmText}<br>
                    <span style="font-size: 13px; color: #555; font-weight: normal;">${distText}</span>
                </div>
            `;
            
            if (trackName !== "Unbekannt") {
                matchCall(trackName);
            } else {
                autoCall.style.display = "none";
            }
        });
    }

    function matchCall(sName) {
        let best = null; let max = 0;
        
        bzTelefonbuch.forEach(e => {
            let score = 0;
            let keys = e.route.toLowerCase().replace(/[()]/g, "").split(/[\s-]+/).filter(k => k.length > 2);
            keys.forEach(k => { if (sName.toLowerCase().includes(k)) score++; });
            if (score > max) { max = score; best = e; }
        });

        if (best && max > 0) {
            autoCall.href = "tel:+41" + best.phone.substring(1);
            autoCall.innerHTML = "📞 " + best.route + " anrufen";
            autoCall.style.display = "block";
            autoCall.style.backgroundColor = "#28a745"; 
        } else {
            autoCall.href = "tel:+41812882682";
            autoCall.innerHTML = "📞 BZ Landquart (Standard) anrufen";
            autoCall.style.display = "block";
            autoCall.style.backgroundColor = "#ff9800"; 
        }
    }

    const dList = document.getElementById('dirList');
    bzTelefonbuch.forEach(e => {
        let item = document.createElement('div');
        item.className = 'dir-item';
        item.innerHTML = `<span class="dir-title">${e.route}</span><a href="tel:+41${e.phone.substring(1)}" class="dir-link">📞 ${e.phone} anrufen</a>`;
        dList.appendChild(item);
    });

    function toggleDirectory() { dList.classList.toggle('open'); }
</script>

</body>
</html>
